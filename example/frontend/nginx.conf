# Nginx cumple dos roles a la vez, y los dos entran en este unico bloque server.

# Abre la definicion de un servidor virtual: todo lo que Nginx tiene que hacer
# con las solicitudes que le lleguen se configura aca adentro.
server {
    # Puerto en el que escucha adentro del contenedor. Se corresponde con el
    # lado derecho del "4200:80" del docker-compose.yml.
    listen 80;

    # --- Rol 1: servidor web -------------------------------------------------

    # Carpeta desde la que se sirven los archivos. Es la misma ruta a la que el
    # Dockerfile copio el build de Angular con COPY --from=build.
    root /usr/share/nginx/html;

    # Archivo que se devuelve cuando la ruta pedida es una carpeta.
    # Si alguien entra a /, Nginx entrega /usr/share/nginx/html/index.html.
    index index.html;

    # --- Rol 2: proxy inverso (hacia el BFF) ---------------------------------

    # Toda solicitud cuya ruta empiece con /api/ se reenvia al BFF (Backend for
    # Frontend) en el contenedor bff:3000.
    # El BFF atiende /api/inicio (fan-out), /api/pedidos y /api/pagos,
    # y se encarga de consultar al backend Spring Boot en la red interna.
    location /api/ {
        proxy_pass http://bff:3000/api/;
        proxy_set_header Host $host;
        # Reenvia la IP original de quien hizo la solicitud. Sirve para logs y auditoria.
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Todo lo demas es la app ---------------------------------------------

    # Atiende cualquier otra ruta. El prefijo / matchea con todo, asi que este
    # bloque es el que queda cuando ningun otro location mas especifico aplica.
    location / {
        # Se leen los tres candidatos en orden, y gana el primero que exista:
        #   $uri   -> el archivo pedido tal cual (/main.js, /styles.css)
        #   $uri/  -> lo mismo, pero interpretado como carpeta
        #   /index.html -> el comodin final, si los dos anteriores fallaron
        # Ese comodin es lo que hace que /pedidos/historial no de 404: esa ruta
        # no existe como archivo, solo existe en el router de Angular. Nginx
        # devuelve index.html y la resuelve la app en el navegador.
        try_files $uri $uri/ /index.html;
    }
}
