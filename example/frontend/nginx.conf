# Nginx cumple dos roles a la vez, y los dos entran en este unico bloque server.

# Abre la definicion de un servidor virtual: todo lo que Nginx tiene que hacer
# con las solicitudes que le lleguen se configura aca adentro.
server {
    # Puerto en el que escucha adentro del contenedor. Se corresponde con el
    # lado derecho del "4200:80" del docker-compose.yml.
    listen 80;

    # --- Rol 1: servidor web -------------------------------------------------

    # Carpeta desde la que se sirven los archivos. Es la misma ruta a la que el
    # Dockerfile copio el build de Angular con COPY --from=build.
    root /usr/share/nginx/html;

    # Archivo que se devuelve cuando la ruta pedida es una carpeta.
    # Si alguien entra a /, Nginx entrega /usr/share/nginx/html/index.html.
    index index.html;

    # Atiende las rutas de la aplicacion. El prefijo / matchea con todo, pero
    # Nginx elige siempre el location mas especifico, asi que las que empiezan
    # con /api/ se las queda el otro bloque.
    location / {
        # Se leen los tres candidatos en orden, y gana el primero que exista:
        #   $uri   -> el archivo pedido tal cual (/main.js, /styles.css)
        #   $uri/  -> lo mismo, pero interpretado como carpeta
        #   /index.html -> el comodin final, si los dos anteriores fallaron
        # Ese comodin es lo que hace que /pedidos/historial no de 404: esa ruta
        # no existe como archivo, solo existe en el router de Angular. Nginx
        # devuelve index.html y la resuelve la app en el navegador.
        try_files $uri $uri/ /index.html;
    }

    # --- Rol 2: proxy inverso (hacia el BFF) ---------------------------------

    # Atiende toda solicitud cuya ruta empiece con /api/.
    location /api/ {
        # No responde Nginx: reenvia la solicitud a otro servidor. "bff" es el
        # nombre del servicio en el compose y 3000 su puerto interno. El BFF
        # atiende /api/inicio, /api/pedidos y /api/pagos, y es el que consulta
        # al backend Spring Boot por la red interna de Docker.
        #
        # Lo que se escribe despues del host REEMPLAZA al prefijo del location.
        # Aca el prefijo /api/ se reemplaza por /api/, asi que la ruta llega
        # igual: /api/pedidos entra al BFF como /api/pedidos. Parece que no
        # hiciera nada, pero es la regla general, y por eso importa:
        # si dejaramos solo la barra (http://bff:3000/) llegaria como /pedidos
        # y el BFF devolveria 404, porque sus rutas estan montadas en /api/.
        proxy_pass http://bff:3000/api/;

        # Reenvia el dominio que pidio el cliente. Sin esto el BFF veria "bff"
        # como host, que es el nombre interno, y no el real.
        proxy_set_header Host $host;

        # Reenvia la IP original de quien hizo la solicitud. Sin esto el BFF
        # veria siempre la IP de Nginx, y todos los pedidos parecerian venir del
        # mismo lugar. Sirve para logs y reglas de seguridad.
        proxy_set_header X-Real-IP $remote_addr;
    }
}
